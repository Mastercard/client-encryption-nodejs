name: Build & Test
'on':
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  schedule:
    - cron: 0 16 * * *
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 17.x
          - 18.x
          - 19.x
          - 20.x
          - 22.x
          - 24.x
    steps:
      - uses: actions/checkout@v7
      - name: 'Use Node.js ${{ matrix.node-version }}'
        uses: actions/setup-node@v6
        with:
          node-version: '${{ matrix.node-version }}'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
